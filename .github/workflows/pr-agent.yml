name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  issue_comment:

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}

          config.model: "openrouter/google/gemini-3.1-flash-lite"
          config.fallback_models: '["openrouter/auto"]'

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
