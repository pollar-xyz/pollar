name: CI

on:
  pull_request:
    # Release branches (0.11.3, 0.12.0, ...) get the same gate as main: work
    # lands there first and only reaches main once it is already merged, so
    # gating main alone means the checks run after the review, not before it.
    branches: [main, '0.*']
  push:
    branches: [main, '0.*']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: format + lint + build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test:smoke
