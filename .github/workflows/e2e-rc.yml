name: E2E on release candidates
on:
  push:
    tags: ['v*-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to test, for example v0.6.0'
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
      E2E_REPO: pollar-xyz/pollar-api-e2e
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Start the E2E run
        run: gh workflow run e2e.yml -R "$E2E_REPO" -f sdk_ref="$TAG"
      - name: Wait for it
        run: |
          for _ in $(seq 30); do
            sleep 10
            id=$(gh run list -R "$E2E_REPO" -w e2e.yml -e workflow_dispatch -L 20 \
              --json databaseId,displayTitle --jq "map(select(.displayTitle == \"E2E $TAG\"))[0].databaseId // empty")
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "E2E run for $TAG not found"; exit 1; }
          echo "E2E run: https://github.com/$E2E_REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$E2E_REPO" --exit-status
