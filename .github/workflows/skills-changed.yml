name: Skills changed

# A reminder, not automation. pollar-web mirrors skills/ into
# pollar.xyz/.well-known/agent-skills/ on a daily cron, so a change here takes
# up to a day to show up there. This job says so at push time, so an urgent
# change can be pushed through by hand instead.
#
# main only: work lands on a release branch (0.*) first and the mirror reads
# main, so announcing before the merge would announce something that cannot be
# published yet.
#
# It does not trigger the sync itself because reaching across repos needs a PAT
# with dispatch permission, and a long-lived token is not worth saving a few
# hours of lag.
#
# Do not move or rename skills/pollar-wallet-auth/. stellar/stellar-dev-skill
# publishes its raw.githubusercontent URL on main as the value a developer
# copies to install the skill (site/src/data/skills.ts, ECOSYSTEM_CARDS), so
# that path is a contract with a third-party repo: change it and their site
# serves a 404 with nobody here being told. The SKILL.md siblings do not move
# either, because its relative links resolve against that same URL.
# skills-contract.yml enforces both.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

permissions:
  contents: read

jobs:
  remind:
    name: remind to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce what changed and how to publish it
        env:
          RUN_SYNC: https://github.com/pollar-xyz/pollar-web/actions/workflows/sync-llms.yml
        run: |
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- skills/ || true)"
          {
            echo '## Skills changed'
            echo
            echo 'These files changed under `skills/`:'
            echo
            echo '```'
            echo "${changed:-(could not diff, see the commit)}"
            echo '```'
            echo
            echo "pollar.xyz mirrors them on a daily cron, so this reaches"
            echo "<https://pollar.xyz/.well-known/agent-skills/index.json> within 24h."
            echo
            echo "To publish now, run **Sync mirrored content** in pollar-web:"
            echo "$RUN_SYNC"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Skills changed::Mirrored to pollar.xyz within 24h. To publish now, run 'Sync mirrored content' in pollar-web: $RUN_SYNC"
